# 클러스터 내부에서 Exporter Pod에 접근하는 Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  # Service 포트와 컨테이너 포트 연결
  ports:
    - name: http
      port: 9115
      targetPort: http
