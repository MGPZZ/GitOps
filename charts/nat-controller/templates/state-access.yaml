# 장애 상태 ConfigMap 하나만 조회하고 갱신
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nat-controller-state
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["nat-controller-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nat-controller-state
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: nat-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nat-controller-state
