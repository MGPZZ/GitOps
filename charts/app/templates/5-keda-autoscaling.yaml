{{- if and .Values.components.backend .Values.autoscaling.backend.enabled }}
{{- $services := list "userservice" "contacts" "balancereader" "ledgerwriter" "transactionhistory" }}
{{- range $serviceName := $services }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $serviceName }}-scaler
  namespace: {{ $.Release.Namespace | default "default" }}
  labels:
    app: {{ $serviceName }}
spec:
  scaleTargetRef:
    name: {{ $serviceName }}
  pollingInterval: {{ $.Values.autoscaling.backend.pollingInterval }}
  cooldownPeriod: {{ $.Values.autoscaling.backend.cooldownPeriod }}
  minReplicaCount: {{ $.Values.autoscaling.backend.minReplicas }}
  maxReplicaCount: {{ $.Values.autoscaling.backend.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    # KRR이 requests.cpu를 줄여도 KEDA 스케일링에 간섭이 없도록
    # requests 대비 비율(%) 대신 절대 CPU 코어 사용량(AverageValue)을 기준으로 스케일링합니다.
    - type: prometheus
      name: cpu-core-usage
      metricType: AverageValue
      metadata:
        serverAddress: {{ $.Values.autoscaling.backend.prometheus.serverAddress | quote }}
        threshold: {{ $.Values.autoscaling.backend.cpuAverageCores | quote }}
        activationThreshold: {{ $.Values.autoscaling.backend.activationThreshold | default "0.02" | quote }}
        ignoreNullValues: "false"
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="{{ $.Release.Namespace | default "default" }}", pod=~"{{ $serviceName }}-.*", container!="", container!="POD"}[2m]))
---
{{- end }}
{{- end }}
