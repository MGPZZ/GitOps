{{- if and .Values.components.backend .Values.autoscaling.backend.enabled }}
{{- $services := list "userservice" "contacts" "balancereader" "ledgerwriter" "transactionhistory" }}
{{- range $serviceName := $services }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $serviceName }}-scaler
  namespace: {{ $.Release.Namespace | default "default" }}
  labels:
    app: {{ $serviceName }}
spec:
  scaleTargetRef:
    name: {{ $serviceName }}
  pollingInterval: {{ $.Values.autoscaling.backend.pollingInterval }}
  cooldownPeriod: {{ $.Values.autoscaling.backend.cooldownPeriod }}
  minReplicaCount: {{ $.Values.autoscaling.backend.minReplicas }}
  maxReplicaCount: {{ $.Values.autoscaling.backend.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: {{ $.Values.autoscaling.backend.prometheus.serverAddress | quote }}
        threshold: {{ $.Values.autoscaling.backend.cpuUtilization | quote }}
        ignoreNullValues: "false"
        query: |
          100 * sum(rate(container_cpu_usage_seconds_total{namespace="{{ $.Release.Namespace }}", pod=~"{{ $serviceName }}-.*", container!="", container!="POD"}[2m]))
          / (sum(kube_pod_container_resource_requests{namespace="{{ $.Release.Namespace }}", pod=~"{{ $serviceName }}-.*", resource="cpu", container!="", container!="POD"}) > 0)
---
{{- end }}
{{- end }}
