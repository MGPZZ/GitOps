{{- if and .Values.components.frontend .Values.autoscaling.frontend.enabled }}
# Bank of Anthos frontend에 절대 CPU 사용량 기반 KEDA 오토스케일링을 적용합니다.
# frontend는 Deployment가 아닌 Argo Rollout이므로 scaleTargetRef에 Rollout 타입을 명시합니다.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: frontend-scaler
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app: frontend
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: mak-app-rollout
  pollingInterval: {{ .Values.autoscaling.frontend.pollingInterval }}
  cooldownPeriod: {{ .Values.autoscaling.frontend.cooldownPeriod }}
  minReplicaCount: {{ .Values.autoscaling.frontend.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.frontend.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.autoscaling.frontend.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: 1
              periodSeconds: {{ .Values.autoscaling.frontend.scaleDown.periodSeconds }}
  triggers:
    # KRR이 requests.cpu를 줄여도 KEDA와 충돌하지 않도록
    # requests 대비 비율(%)이나 미배포 Chronos 대신 절대 CPU 코어 사용량 기준으로 스케일링합니다.
    - type: prometheus
      name: cpu-core-usage
      metricType: AverageValue
      metadata:
        serverAddress: {{ .Values.autoscaling.frontend.prometheus.serverAddress | quote }}
        threshold: {{ .Values.autoscaling.frontend.cpuAverageCores | quote }}
        activationThreshold: {{ .Values.autoscaling.frontend.activationThreshold | default "0.02" | quote }}
        ignoreNullValues: "false"
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="{{ .Release.Namespace | default "default" }}", pod=~"mak-app-rollout-.*", container="mak-container"}[2m]))
---
{{- end }}