{{- if .Values.components.backend -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
      annotations:
        app.mgpzz.com/image-revision: {{ .Values.imageRevision | quote }}
    spec:
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: userservice
          image: "{{ .Values.ecrRegistry }}/{{ .Values.images.userservice }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          resources:
{{ toYaml .Values.resources.userservice.app | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/privatekey
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: side-project-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: side-project-db-app
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@side-project-db-rw.backend.svc.cluster.local:5432/app"
          envFrom:
            - configMapRef:
                name: environment-config
            - configMapRef:
                name: accounts-db-config
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /tmp/.ssh
              name: keys
              readOnly: true
      volumes:
        - emptyDir: {}
          name: tmp
        - name: keys
          secret:
            secretName: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret | quote }}
            items:
              - key: jwtRS256.key
                path: privatekey
              - key: jwtRS256.key.pub
                path: publickey
---
apiVersion: v1
kind: Service
metadata:
  name: userservice
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: userservice
---
