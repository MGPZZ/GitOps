# 기본 애플리케이션 설정
replicaCount: 3
nodeSelector:
  role: worker
images:
  frontend: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/frontend_ecr:latest"
  userservice: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/userservice_ecr:latest"
  contacts: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/contacts_ecr:latest"
  balancereader: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/balancereader_ecr:latest"
  ledgerwriter: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/ledgerwriter_ecr:latest"
  transactionhistory: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/transactionhistory_ecr:latest"
  worker: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/sample-fastapi:v0.1.22"
  loadgen: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/loadgen_ecr:v0.6.11"
imageRevision: "initial"
image:
  pullPolicy: Always
# 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  frontend:
    requests: {cpu: "200m", memory: "256Mi"}
    limits: {cpu: "500m", memory: "512Mi"}
  userservice:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  contacts:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  balancereader:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  ledgerwriter:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
  transactionhistory:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
    worker:
      requests: {cpu: "250m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "512Mi"}
service:
  type: ClusterIP
  port: 80
# Redis 연결 설정
redis:
  host: "master.side-project-sample-redis.uuepdo.apn2.cache.amazonaws.com"
  port: 6379
  db: 0
  password: "" # Redis 비밀번호 (ElastiCache에 설정되지 않음)
  tlsEnabled: true # 로컬/K8s 내부는 false, ElastiCache TLS 사용 시 true
secrets:
  # JWT 키 본문은 이 Chart에 넣지 않습니다. Secret은 배포 전에 별도로 생성해야 합니다.
  # Secret에는 jwtRS256.key와 jwtRS256.key.pub가 있어야 합니다.
  existingSecret: "jwt-key"
components:
  backend: true
  frontend: true
# KEDA 기반 오토스케일링 설정
autoscaling:
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 10
    cooldownPeriod: 60
    redisListLength: "20" # 대기자 20명당 pod 1개 증설
    slotsPerPod: "20" # pod 1개당 허용 동시 접속자 (frontend.py SLOTS_PER_POD과 동일하게 유지)
    userSessionTtl: "60" # 사용자 세션 TTL (초) - 이 시간 동안 활동 없으면 슬롯 반환
    scaleDown:
      stabilizationWindowSeconds: 300
      periodSeconds: 60
  backend:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: 5
    cooldownPeriod: 60
    redisListLength: "2"
# 유한 시간 Bank of Anthos k6 Job. runId 변경이 재실행 키이며 기본값은 배포하지 않음.
loadgen:
  enabled: false
  image: "grafana/k6:0.54.0"
  runId: ""
  phase: "smoke"
  scenarioName: "boa-long-cycle-v1"
  scenarioVersion: "v1"
  profile: "smoke"
  timeScale: "1"
  cycles: "1"
  lowRps: "100"
  normalRps: "300"
  peakRps: "500"
  spikeRps: "700"
  recoveryRps: "100"
  maxVUs: "2000"
  paymentPercent: "50"
  paymentAmount: "0.01"
  authMode: "shared"
  prometheusRemoteWriteEnabled: false
  prometheusRemoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
  activeDeadlineSeconds: 90000
  podAnnotations:
    # karpenter.sh/do-not-disrupt: "true"
  credentialsSecret:
    name: "bank-loadgen-credentials"
    usernameKey: "username"
    passwordKey: "password"
    recipientAccountKey: "recipient-account"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
hostname: vche.cloud