# 기본 애플리케이션 설정
replicaCount: 3
nodeSelector:
  role: worker
images:
  frontend: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/frontend_ecr:latest"
  userservice: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/userservice_ecr:latest"
  contacts: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/contacts_ecr:latest"
  balancereader: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/balancereader_ecr:latest"
  ledgerwriter: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/ledgerwriter_ecr:latest"
  transactionhistory: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/transactionhistory_ecr:latest"
  loadgen: "597936860185.dkr.ecr.ap-northeast-2.amazonaws.com/loadgen_ecr:v0.6.11"
imageRevision: "initial"
image:
  pullPolicy: Always
# 패턴 분석 결과에 따라 깃허브 액션이 변경할 자원 권장값 영역
resources:
  frontend:
    requests: {cpu: "200m", memory: "256Mi"}
    limits: {cpu: "500m", memory: "512Mi"}
  userservice:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
  contacts:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
  balancereader:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
  ledgerwriter:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
  transactionhistory:
    app:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {}
service:
  type: ClusterIP
  port: 80
secrets:
  # JWT 키 본문은 이 Chart에 넣지 않습니다. Secret은 배포 전에 별도로 생성해야 합니다.
  # Secret에는 jwtRS256.key와 jwtRS256.key.pub가 있어야 합니다.
  existingSecret: "jwt-key"
components:
  backend: true
  frontend: true
# KEDA 기반 오토스케일링 설정
autoscaling:
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    pollingInterval: 10
    cooldownPeriod: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      periodSeconds: 60
  backend:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: 5
    cooldownPeriod: 60
    cpuUtilization: "70" # Percentage of requested CPU; requires Kubernetes Metrics Server.
# 유한 시간 Bank of Anthos k6 Job. runId 변경이 재실행 키이며 기본값은 배포하지 않음.
loadgen:
  enabled: false
  image: "grafana/k6:0.54.0"
  runId: ""
  phase: "smoke"
  scenarioName: "boa-long-cycle-v1"
  scenarioVersion: "v1"
  profile: "smoke"
  timeScale: "1"
  cycles: "1"
  lowRps: "100"
  normalRps: "300"
  peakRps: "500"
  spikeRps: "700"
  recoveryRps: "100"
  maxVUs: "2000"
  paymentPercent: "50"
  paymentAmount: "0.01"
  authMode: "shared"
  prometheusRemoteWriteEnabled: false
  prometheusRemoteWriteUrl: "http://prometheus-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
  activeDeadlineSeconds: 90000
  podAnnotations:
    # karpenter.sh/do-not-disrupt: "true"
  credentialsSecret:
    name: "bank-loadgen-credentials"
    usernameKey: "username"
    passwordKey: "password"
    recipientAccountKey: "recipient-account"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
hostname: vche.cloud