gatewayName: "my-gateway"
gatewayNamespace: "default"
domain: "vche.cloud"

httpRoutes:
  - name: argocd-route
    namespace: argocd
    subdomain: "argocd"
    serviceName: "argocd-server"
    port: 80
  - name: grafana-route
    namespace: monitoring
    subdomain: "grafana"
    serviceName: "prometheus-stack-grafana"
    port: 80
  - name: prometheus-route
    namespace: monitoring
    subdomain: "prometheus"
    serviceName: "prometheus-public-auth"
    port: 80
    healthCheck:
      path: /healthz
      successCodes: "200"
  - name: alertmanager-route
    namespace: monitoring
    subdomain: "alertmanager"
    serviceName: "prometheus-stack-kube-prom-alertmanager"
    port: 9093
  - name: tg-gateway-route
    namespace: monitoring
    subdomain: "alarm"
    serviceName: "tg-gateway-service"
    port: 8000
prometheusAuth:
  priorityClassName: support-workload
  enabled: true
  username: admin
  passwordHash: "{SHA}e5Aub/Hbn1YEQ/IEiXT9fThpdbA="
  image:
    repository: nginx
    tag: "1.27.5-alpine"
